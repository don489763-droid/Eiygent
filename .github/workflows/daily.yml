name: Daily YinYang Email

on:
  schedule:
    - cron: '0 5 * * *' # 7am SA time
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install resend
      - run: node send.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
